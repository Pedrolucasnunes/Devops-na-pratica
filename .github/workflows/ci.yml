name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Testes (Node ${{ matrix.node }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Testes unitários e de integração com cobertura (mínimo 80%)
        run: npm run test:coverage
      - name: Publicar relatório de cobertura
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build da imagem Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t taskflow-api:${{ github.sha }} .
      - name: Smoke test do container
        run: |
          docker run -d --name api -p 3000:3000 taskflow-api:${{ github.sha }}
          for i in $(seq 1 10); do
            curl -fs http://localhost:3000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1

  terraform:
    name: Validação Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init (sem backend remoto)
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate
